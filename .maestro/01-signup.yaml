appId: ${ANDROID_APPLICATION_ID}
---
- runFlow:
    when:
      platform: iOS
    commands:
      - clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ".*Firebase Auth initialized & subscribed.*"
    timeout: 60000
- tapOn: "Email & Password"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "sign-up"
          text: "Sign Up"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Sign Up"
# Fresh create → User Account; existing account → email-already-in-use (not a suite failure).
- extendedWaitUntil:
    visible: ".*(User Account|email-already-in-use).*"
    timeout: 30000
- runFlow:
    when:
      visible: ".*email-already-in-use.*"
      platform: Android
    commands:
      - tapOn:
          id: "sign-in"
          text: "Sign In"
- runFlow:
    when:
      visible: ".*email-already-in-use.*"
      platform: iOS
    commands:
      - tapOn: "Sign In"
- extendedWaitUntil:
    visible: "User Account"
    timeout: 30000
- assertVisible: ".*(Created user:|Signed in user:).*"
- scrollUntilVisible:
    element:
      text: "Update Display Name"
    direction: DOWN
    timeout: 10000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "update-display-name"
          text: "Update Display Name"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Update Display Name"
- extendedWaitUntil:
    visible: ".*Display name updated successfully!.*"
    timeout: 30000
