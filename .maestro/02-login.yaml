appId: ${ANDROID_APPLICATION_ID}
---
- runFlow:
    when:
      platform: iOS
    commands:
      - clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ".*Firebase Auth initialized & subscribed.*"
    timeout: 60000
- tapOn: "Email & Password"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "sign-in"
          text: "Sign In"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Sign In"
- extendedWaitUntil:
    visible: "User Account"
    timeout: 30000
- assertVisible: ".*Signed in user:.*"
