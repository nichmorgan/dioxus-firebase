name: Test

on:
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64-linux-android

      - name: Test android
        uses: ClementTsang/cargo-action@v0.0.7
        with:
          command: test
          args: --lib --target aarch64-linux-android
          use-cross: true
          cross-version: main

  ios:
    name: iOS (simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-aarch64-apple-ios-sim

      - name: Boot iOS Simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -E -o "[0-9A-F-]{36}")
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Test iOS
        env:
          CARGO_TARGET_AARCH64_APPLE_IOS_SIM_RUNNER: xcrun simctl spawn booted
        run: cargo test --lib --target aarch64-apple-ios-sim

  ios-host:
    name: iOS host (dx)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true
          key: ios-host-dx-0.7.10

      - name: Install Dioxus CLI 0.7.10
        run: cargo install dioxus-cli --version 0.7.10 --locked

      - name: Boot iOS Simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -E -o "[0-9A-F-]{36}")
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Build demo with embedded Swift host
        run: dx build --example demo --platform ios --target aarch64-apple-ios-sim

      - name: Assert Auth host class is loadable
        run: |
          set -euo pipefail
          ROOT="$(pwd)"
          APP=$(find "${ROOT}/target/dx" -type d -name 'Demo.app' -print -quit)
          if [ -z "${APP}" ]; then
            echo "Demo.app not found under target/dx"
            find "${ROOT}/target/dx" -type d \( -name '*.app' -o -name '*.framework' \) || true
            exit 1
          fi
          if [ -f "${APP}/Frameworks/DioxusSwiftPlugins.framework/DioxusSwiftPlugins" ]; then
            FRAMEWORK="${APP}/Frameworks/DioxusSwiftPlugins.framework/DioxusSwiftPlugins"
          elif [ -f "${APP}/Frameworks/DioxusFirebaseAuthHost.framework/DioxusFirebaseAuthHost" ]; then
            FRAMEWORK="${APP}/Frameworks/DioxusFirebaseAuthHost.framework/DioxusFirebaseAuthHost"
          else
            echo "Swift host framework missing in ${APP}/Frameworks"
            find "${APP}" -type d -name '*.framework' || true
            exit 1
          fi
          echo "Loading ${FRAMEWORK}"
          xcrun nm -gU "${FRAMEWORK}" | grep DioxusFirebaseAuthHost || true

          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          SWIFT_BIN=$(xcrun --find swift)
          SWIFT_LIB="$(cd "$(dirname "${SWIFT_BIN}")/../lib/swift/iphonesimulator" && pwd)"
          mkdir -p "${ROOT}/target"
          cat > "${ROOT}/target/check_host.m" <<'EOF'
          #import <Foundation/Foundation.h>
          #include <dlfcn.h>
          #include <stdio.h>

          int main(int argc, char **argv) {
              if (argc != 2) {
                  fprintf(stderr, "usage: check_host <framework-binary>\n");
                  return 2;
              }
              void *handle = dlopen(argv[1], RTLD_NOW | RTLD_GLOBAL);
              if (handle == NULL) {
                  const char *err = dlerror();
                  fprintf(stderr, "dlopen failed: %s\n", err ? err : "unknown");
                  return 3;
              }
              Class cls = NSClassFromString(@"DioxusFirebaseAuthHost");
              if (cls == Nil) {
                  fprintf(stderr, "DioxusFirebaseAuthHost not found after dlopen\n");
                  return 4;
              }
              return 0;
          }
          EOF
          CHECK="${ROOT}/target/check_host"
          xcrun --sdk iphonesimulator clang \
            -target arm64-apple-ios-simulator \
            -isysroot "${SDK}" \
            -mios-simulator-version-min=15.0 \
            -framework Foundation \
            -Wl,-rpath,"${APP}/Frameworks" \
            -Wl,-rpath,"${SWIFT_LIB}" \
            "${ROOT}/target/check_host.m" \
            -o "${CHECK}"
          codesign --sign - --force "${CHECK}"
          if ! xcrun simctl spawn booted "${CHECK}" "${FRAMEWORK}"; then
            echo "--- otool -L ---"
            xcrun otool -L "${FRAMEWORK}" || true
            exit 1
          fi
